[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eyeglass-glare-removal"
version = "0.1.0"
description = "General-purpose eyeglass glare removal for video using SAM2.1 lens tracking, Wan2.1-VACE inpainting, and rim-safe streaming compositing."
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
keywords = [
    "computer-vision",
    "video-inpainting",
    "glare-removal",
    "eyeglasses",
    "sam2",
    "wan-vace",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
    "Pillow>=10.0",
    "scipy>=1.11",
    "torch>=2.6.0",
    "torchvision>=0.21.0",
    "safetensors>=0.4.5",
    "transformers>=4.57.0",
    "diffusers>=0.37.0",
    "accelerate>=1.0",
    "ftfy>=6.1",
    "huggingface-hub>=0.25",
]

[project.optional-dependencies]
mediapipe = [
    "mediapipe>=0.10.14",
]
quant = [
    "bitsandbytes>=0.45",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.scripts]
glare-remove = "eyeglass_glare_removal.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
